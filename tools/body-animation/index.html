<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Part Animation Test</title>
<style>
  :root { --bg:#eef2f7; --panel:#ffffff; --ink:#1b2430; --line:#d5dde8; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f1622; --panel:#17212f; --ink:#e6edf6; --line:#2a3a50; --accent:#60a5fa; }
  }
  :root[data-theme="dark"] { --bg:#0f1622; --panel:#17212f; --ink:#e6edf6; --line:#2a3a50; --accent:#60a5fa; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  .wrap { max-width:1140px; margin:0 auto; padding:16px; display:grid; grid-template-columns:minmax(0,500px) minmax(0,1fr); gap:16px; align-items:start; }
  .wrap h1 { grid-column:1 / -1; font-size:18px; margin:4px 0; }
  .left { display:flex; flex-direction:column; gap:12px; align-items:center; position:sticky; top:16px; }
  .right { display:flex; flex-direction:column; gap:12px; min-width:0; }
  @media (max-width:960px) {
    .wrap { grid-template-columns:minmax(0,1fr); }
    .left { position:static; width:100%; }
  }
  canvas { width:500px; height:500px; max-width:100%; background:linear-gradient(#a9c9ea,#6f97c4); border:1px solid var(--line); border-radius:8px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; width:100%; box-sizing:border-box; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .panel .title { font-weight:700; width:100%; font-size:12px; opacity:.7; text-transform:uppercase; letter-spacing:.04em; }
  button { font:inherit; padding:6px 10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:6px; cursor:pointer; }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  select { font:inherit; padding:5px 8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:6px; }
  select:disabled { opacity:.4; }
  label { display:flex; gap:6px; align-items:center; }
  input[type=range] { width:140px; max-width:100%; }
  input[type=number] { max-width:100%; }
  .log { font:12px/1.5 ui-monospace, monospace; white-space:pre-wrap; opacity:.8; }
  .note { font-size:12px; opacity:.75; text-align:center; max-width:500px; min-height:1em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Body Part Animation Test</h1>
  <div class="left">
    <canvas id="c" width="500" height="500"></canvas>
    <div class="note" id="note"></div>
    <div class="log" id="log"></div>
  </div>
  <div class="right">
    <div class="panel" id="poses"><div class="title">Pose</div></div>
    <div class="panel" id="parts"><div class="title">Body parts</div></div>
    <div class="panel" id="gear"><div class="title">Equipment (choose one per slot, None = not worn)</div></div>
    <div class="panel" id="pos"><div class="title">Layers: drawn in this order (1 = bottom, last = top), with X, Y of top-left corner</div></div>
    <div class="panel">
      <div class="title">Playback</div>
      <label><input type="checkbox" id="bob" checked> Idle bob</label>
      <label>Speed <input type="range" id="speed" min="0.5" max="3" step="0.1" value="1"></label>
      <label>Scale <input type="range" id="scale" min="0.6" max="1.6" step="0.05" value="1"></label>
      <button id="restart">Restart</button>
    </div>
    <div class="panel">
      <div class="title">Export positions</div>
      <button id="copy">Copy all positions</button>
      <textarea id="export" readonly rows="8" style="width:100%;font:12px/1.4 ui-monospace,monospace;box-sizing:border-box"></textarea>
    </div>
  </div>
</div>

<script>
// Placements are top-left corners in one shared frame. Every pose is centred on the same point (283.5, 239.4),
// so switching poses does not jump. Each part has an optional scale (sc) where the sample showed a smaller size.
const CENTRE = { x: 283.5, y: 239.4 };

// Equipment slots. The dropdown for each slot lists every option that appears under it in GEAR.
// Sword layers already contain the gripping hand, so the bare left hand is hidden while a sword is worn.
const GEAR_SLOTS = { helmet: 'Helmet', wear: 'Armor (gear)', sword: 'Weapon', shield: 'Shield', foot: 'Foot', garment: 'Garment' };

// GEAR[pose][slot][option] = placement of that option's sprite in that pose.
// To add gear: add an option key (for example "lv20") under each slot and each pose you have art for.
// It appears in the dropdown automatically. A pose without that option simply draws nothing for the slot.
// "wear" replaces the body armor while it is equipped.
const GEAR = {
  attack: {
    helmet: { shoplv10: { src: 'gear/helmet/hatssattacklv10.png', x: 320, y: 46, sc: 1 } , bosslv1: { src: 'gear/helmet/boss/ssattackbosslv1.png', x: 304, y: 32, sc: 1 } , bosslv10: { src: 'gear/helmet/boss/ssattackbosslv10.png', x: 298, y: 28, sc: 1 } , bosslv20: { src: 'gear/helmet/boss/ssbasebosslv20.png', x: 292, y: 32, sc: 1 } , shoplv20: { src: 'gear/helmet/shop/ssbaseshoplv20.png', x: 314, y: 30, sc: 1 } },
    wear: { lv10: { src: 'gear/wear/ssattackarmorlv10.png', x: 192, y: 112, sc: 1 } },
    sword: { lv10: { src: 'gear/attack/ssattackswordlv10.png', x: 146, y: 170, sc: 1 } },
    shield: { lv10: { src: 'gear/attack/ssattackshield.png', x: 415, y: 154, sc: 1 } },
    foot: { lv10: { src: 'gear/foot/ssattackfootlv10.png', x: 149, y: 224, sc: 1 } },
    garment: { lv10: { src: 'gear/garment/ssattackmanteaulv10.png', x: 196, y: 100, sc: 1 } }
  },
  base: {
    helmet: { shoplv10: { src: 'gear/helmet/hatbaseattacklv10.png', x: 226, y: 39, sc: 1 } , bosslv1: { src: 'gear/helmet/boss/ssbasebosslv1.png', x: 214, y: 34, sc: 1 } , bosslv10: { src: 'gear/helmet/boss/ssbasebosslv10.png', x: 200, y: 22, sc: 1 } , bosslv20: { src: 'gear/helmet/boss/ssattackbosslv20.png', x: 207, y: 30, sc: 1 } , shoplv20: { src: 'gear/helmet/shop/ssattackshoplv20.png', x: 222, y: 27, sc: 1 } },
    wear: { lv10: { src: 'gear/wear/ssbasearmorlv10.png', x: 172, y: 129, sc: 1 } },
    sword: { lv10: { src: 'gear/base/ssbasesword.png', x: 25, y: 241, sc: 1 } },
    shield: { lv10: { src: 'gear/shield/ssshield.png', x: 321, y: 139, sc: 1 } },
    foot: { lv10: { src: 'gear/foot/ssbasefootlv10.png', x: 196, y: 246, sc: 1 } },
    garment: { lv10: { src: 'gear/garment/ssbasemanteaulv10.png', x: 168, y: 113, sc: 1 } }
  },
  block: {
    helmet: { shoplv10: { src: 'gear/helmet/hatssblocklv10.png', x: 264, y: 59, sc: 1 } , bosslv1: { src: 'gear/helmet/boss/ssblockbosslv1.png', x: 250, y: 51, sc: 1 } , bosslv10: { src: 'gear/helmet/boss/ssblockbosslv10.png', x: 240, y: 41, sc: 1 } , bosslv20: { src: 'gear/helmet/boss/ssblockbosslv20.png', x: 246, y: 58, sc: 1 } , shoplv20: { src: 'gear/helmet/shop/ssblockshoplv20.png', x: 264, y: 48, sc: 1 } },
    wear: { lv10: { src: 'gear/wear/ssblockarmorlv10.png', x: 165, y: 127, sc: 1 } },
    sword: { lv10: { src: 'gear/block/ssblocksword.png', x: 127, y: 224, sc: 1 } },
    shield: { lv10: { src: 'gear/shield/ssshield.png', x: 363, y: 138, sc: 1 } },
    foot: { lv10: { src: 'gear/foot/ssblockfootlv10.png', x: 164, y: 263, sc: 1 } },
    garment: { lv10: { src: 'gear/garment/ssblockmanteaulv10.png', x: 170, y: 110, sc: 1 } }
  },
  critical: {
    helmet: { shoplv10: { src: 'gear/helmet/hatsscriticallv10.png', x: 272, y: 35, sc: 1 } , bosslv1: { src: 'gear/helmet/boss/sscriticalbosslv1.png', x: 264, y: 22, sc: 1 } , bosslv10: { src: 'gear/helmet/boss/sscriticalbosslv10.png', x: 252, y: 13, sc: 1 } , bosslv20: { src: 'gear/helmet/boss/sscriticalbosslv20.png', x: 260, y: 27, sc: 1 } , shoplv20: { src: 'gear/helmet/shop/sscriticalshoplv20.png', x: 269, y: 22, sc: 1 } },
    wear: { lv10: { src: 'gear/wear/sscriticalarmorlv10.png', x: 219, y: 72, sc: 1 } },
    sword: { lv10: { src: 'gear/critical/sscriticalsword.png', x: 30, y: 62, sc: 1 }, lv1: { src: 'gear/critical/sscriticalsword_lv1.png', x: 65, y: 38, sc: 1 } },
    shield: { lv10: { src: 'gear/shield/ssshield.png', x: 361, y: 137, sc: 1 } },
    foot: { lv10: { src: 'gear/foot/sscriticalfootlv10.png', x: 144, y: 270, sc: 1 } },
    garment: { lv10: { src: 'gear/garment/sscriticalmanteaulv10.png', x: 166, y: 132, sc: 1 } }
  }
};

const POSES = {
  base: {
    label: 'base',
    parts: [
      { id: 'leg',       name: 'Leg',        src: 'base/dbaseleg.png',       x: 196, y: 246, sc: 1 },
      { id: 'armor',     name: 'Armor',      src: 'base/dbasearmor.png',     x: 172, y: 133, sc: 1 },
      { id: 'head',      name: 'Head',       src: 'base/dbasehead.png',      x: 223, y: 40,  sc: 1 },
      { id: 'lefthand',  name: 'Left hand',  src: 'base/dbaselefthand.png',  x: 168, y: 241, sc: 0.95 },
      { id: 'righthand', name: 'Right hand', src: 'base/dbaserighthand.png', x: 334, y: 209, sc: 1.05 }
    ]
  },
  attack: {
    label: 'attack',
    parts: [
      { id: 'leg',       name: 'Leg',        src: 'attack/dattackleg.png',       x: 112, y: 194, sc: 0.975 },
      { id: 'armor',     name: 'Armor',      src: 'attack/dattackarmor.png',     x: 193, y: 116, sc: 1 },
      { id: 'head',      name: 'Head',       src: 'attack/dattackhead.png',      x: 315, y: 44,  sc: 1 },
      { id: 'lefthand',  name: 'Left hand',  src: 'attack/dattacklefthand.png',  x: 156, y: 182, sc: 0.975 },
      { id: 'righthand', name: 'Right hand', src: 'attack/dattackrighthand.png', x: 406, y: 223, sc: 1 }
    ]
  },
  block: {
    label: 'block',
    parts: [
      { id: 'leg',       name: 'Leg',        src: 'block/dblockleg.png',       x: 164, y: 263, sc: 1 },
      { id: 'armor',     name: 'Armor',      src: 'block/dblockarmor.png',     x: 164, y: 130, sc: 1 },
      { id: 'head',      name: 'Head',       src: 'block/dblockhead.png',      x: 258, y: 59,  sc: 1 },
      { id: 'lefthand',  name: 'Left hand',  src: 'block/dblocklefthand.png',  x: 146, y: 229, sc: 1 },
      { id: 'righthand', name: 'Right hand', src: 'block/dblockrighthand.png', x: 385, y: 211, sc: 1 }
    ]
  },
  critical: {
    label: 'critical',
    parts: [
      { id: 'leg',       name: 'Leg',        src: 'critical/dcriticalleg.png',       x: 91, y: 236, sc: 1 },
      { id: 'armor',     name: 'Armor',      src: 'critical/dcriticalarmor.png',     x: 215, y: 95,  sc: 1 },
      { id: 'head',      name: 'Head',       src: 'critical/dcriticalhead.png',      x: 270, y: 29,  sc: 1 },
      { id: 'lefthand',  name: 'Left hand',  src: 'critical/dcriticallefthand.png',  x: 220, y: 71,  sc: 0.8 },
      { id: 'righthand', name: 'Right hand', src: 'critical/dcriticalrighthand.png', x: 393, y: 207, sc: 1 }
    ]
  }
};

// Default layer order per pose, bottom to top (the last id is the top layer). Edited in the panel.
const LAYER_ORDER = {
  base:     ['leg', 'foot', 'garment', 'armor', 'wear', 'head', 'helmet', 'sword', 'lefthand', 'righthand', 'shield'],
  attack:   ['shield', 'leg', 'foot', 'garment', 'armor', 'wear', 'head', 'helmet', 'sword', 'lefthand', 'righthand'],
  block:    ['leg', 'foot', 'garment', 'armor', 'wear', 'head', 'helmet', 'sword', 'lefthand', 'righthand', 'shield'],
  critical: ['garment', 'foot', 'leg', 'armor', 'wear', 'head', 'sword', 'helmet', 'lefthand', 'righthand', 'shield']
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');
const noteEl = document.getElementById('note');
const state = {
  pose: 'attack',
  on: new Set(POSES.attack.parts.map(p => p.id)),
  // The worn option for each slot, or null for none.
  equip: { helmet: null, wear: null, sword: 'lv10', shield: 'lv10', foot: null, garment: null },
  bob: true, speed: 1, scale: 1,
  order: {}
};
const cache = {};
let t0 = performance.now();

function load(src) {
  if (!cache[src]) {
    cache[src] = new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('Failed to load ' + src));
      img.src = src;
    });
  }
  return cache[src];
}

// Every option name that appears under a slot, across all poses.
function optionsFor(slot) {
  const names = new Set();
  for (const key of Object.keys(GEAR)) for (const o of Object.keys(GEAR[key][slot] || {})) names.add(o);
  return [...names];
}

// The placement object for a slot in a pose, or null when nothing is worn or the pose has no art for it.
function wornPlacement(poseKey, slot) {
  const opt = state.equip[slot];
  if (!opt) return null;
  return (GEAR[poseKey][slot] || {})[opt] || null;
}

function defaultOrder(poseKey) {
  return LAYER_ORDER[poseKey].slice();
}

function orderFor(poseKey) {
  if (!state.order[poseKey]) state.order[poseKey] = defaultOrder(poseKey);
  return state.order[poseKey];
}

// Default body parts hidden while something is worn in that slot. Sword layers already show the gripping hand,
// worn armor replaces the body armor, a worn helmet replaces the head, and worn boots replace the leg.
const SLOT_HIDES = { helmet: ['head'], wear: ['armor'], sword: ['lefthand'], foot: ['leg'] };

// Build the draw list for the current pose from its layer order.
function drawList(poseKey) {
  const pose = POSES[poseKey];
  const hidden = new Set();
  for (const slot of Object.keys(GEAR_SLOTS)) {
    if (wornPlacement(poseKey, slot)) for (const pid of (SLOT_HIDES[slot] || [])) hidden.add(pid);
  }
  const list = [];
  for (const id of orderFor(poseKey)) {
    if (GEAR_SLOTS[id]) {                          // an equipment slot: draw what is worn in it
      const placed = wornPlacement(poseKey, id);
      if (placed) list.push({ id, ...placed });
      continue;
    }
    if (hidden.has(id)) continue;
    list.push(pose.parts.find(p => p.id === id));
  }
  return list;
}

let rendering = false;
async function draw(now) {
  const s = state.scale;
  const bob = state.bob ? Math.sin((now - t0) * 0.0045 * state.speed) * 4 : 0;
  const ox = canvas.width / 2 - CENTRE.x * s;
  const oy = canvas.height / 2 - CENTRE.y * s + bob;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const notes = [];
  for (const item of drawList(state.pose)) {
    const isGear = item.src.startsWith('gear/');
    if (!isGear && !state.on.has(item.id)) continue;
    const img = await load(item.src);
    const k = s * (item.sc || 1);
    ctx.drawImage(img, ox + item.x * s, oy + item.y * s, img.naturalWidth * k, img.naturalHeight * k);
    notes.push(`${item.id}: ${img.naturalWidth}x${img.naturalHeight} at (${item.x}, ${item.y})`);
  }
  logEl.textContent = notes.join('\n');
}

function loop(now) {
  if (!rendering) {
    rendering = true;
    draw(now).catch(e => logEl.textContent = e.message).finally(() => rendering = false);
  }
  requestAnimationFrame(loop);
}

function buildControls() {
  const poseBox = document.getElementById('poses');
  for (const key of Object.keys(POSES)) {
    const b = document.createElement('button');
    b.textContent = POSES[key].label;
    b.dataset.pose = key;
    b.onclick = () => selectPose(key);
    poseBox.appendChild(b);
  }

  const partBox = document.getElementById('parts');
  for (const part of POSES.attack.parts) {
    const b = document.createElement('button');
    b.textContent = part.name;
    b.dataset.part = part.id;
    b.onclick = () => {
      if (state.on.has(part.id)) state.on.delete(part.id); else state.on.add(part.id);
      sync();
    };
    partBox.appendChild(b);
  }

  // One dropdown per equipment slot: None, then every option defined for it.
  const gearBox = document.getElementById('gear');
  for (const slot of Object.keys(GEAR_SLOTS)) {
    const lab = document.createElement('label');
    lab.textContent = GEAR_SLOTS[slot] + ' ';
    const sel = document.createElement('select');
    sel.dataset.slot = slot;
    const none = document.createElement('option');
    none.value = '';
    none.textContent = 'None';
    sel.appendChild(none);
    for (const opt of optionsFor(slot)) {
      const o = document.createElement('option');
      o.value = opt;
      o.textContent = opt;
      sel.appendChild(o);
    }
    sel.onchange = () => {
      state.equip[slot] = sel.value || null;
      buildPosRows();
      sync();
    };
    lab.appendChild(sel);
    gearBox.appendChild(lab);
  }

  document.getElementById('bob').onchange = e => state.bob = e.target.checked;
  document.getElementById('speed').oninput = e => state.speed = +e.target.value;
  document.getElementById('scale').oninput = e => state.scale = +e.target.value;
  document.getElementById('restart').onclick = () => { t0 = performance.now(); };
  document.getElementById('copy').onclick = async () => {
    const text = exportPositions();
    document.getElementById('export').value = text;
    try { await navigator.clipboard.writeText(text); } catch (e) { /* clipboard may be blocked; text is still in the box */ }
  };
  buildPosRows();
  sync();
}

// One row per layer of the current pose, in draw order. X/Y edits write into POSES / GEAR; the up/down
// buttons change the layer order in state.order. Gear rows are inactive while that slot is set to None.
function layerItem(poseKey, id) {
  if (GEAR_SLOTS[id]) {
    return { label: GEAR_SLOTS[id], obj: wornPlacement(poseKey, id), gear: true };
  }
  const part = POSES[poseKey].parts.find(p => p.id === id);
  return { label: part.name, obj: part };
}

// Range of the X and Y slider bars, in page pixels.
const BAR_MIN = -200, BAR_MAX = 700;

function buildPosRows() {
  const box = document.getElementById('pos');
  box.querySelectorAll('.row').forEach(r => r.remove());
  const ids = orderFor(state.pose);
  ids.forEach((id, i) => {
    const it = layerItem(state.pose, id);
    const row = document.createElement('div');
    row.className = 'row';
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%';

    const name = document.createElement('span');
    name.textContent = (i + 1) + '. ' + it.label + (it.gear && !it.obj ? ' (not worn)' : '');
    name.style.cssText = 'width:150px';
    row.appendChild(name);

    for (const dir of [-1, 1]) {
      const btn = document.createElement('button');
      btn.textContent = dir < 0 ? '▲' : '▼';
      btn.title = dir < 0 ? 'Move up (drawn later)' : 'Move down (drawn earlier)';
      btn.disabled = (dir < 0 && i === 0) || (dir > 0 && i === ids.length - 1);
      btn.onclick = () => {
        const j = i + dir;
        [ids[i], ids[j]] = [ids[j], ids[i]];
        buildPosRows();
      };
      row.appendChild(btn);
    }

    for (const axis of ['x', 'y']) {
      const lab = document.createElement('label');
      lab.textContent = axis.toUpperCase() + ' ';
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.step = '1';
      inp.style.width = '70px';
      const bar = document.createElement('input');
      bar.type = 'range';
      bar.min = String(BAR_MIN);
      bar.max = String(BAR_MAX);
      bar.step = '1';
      bar.style.width = '110px';
      if (it.obj) {
        const clamp = v => Math.max(BAR_MIN, Math.min(BAR_MAX, v));
        inp.value = it.obj[axis];
        bar.value = clamp(it.obj[axis]);
        inp.oninput = () => {
          if (inp.value === '') return;
          const v = Math.round(+inp.value);
          it.obj[axis] = v;
          bar.value = clamp(v);
        };
        bar.oninput = () => {
          it.obj[axis] = +bar.value;
          inp.value = bar.value;
        };
      } else {
        inp.disabled = true;
        bar.disabled = true;
      }
      lab.appendChild(inp);
      lab.appendChild(bar);
      row.appendChild(lab);
    }
    box.appendChild(row);
  });

  const reset = document.createElement('button');
  reset.className = 'row';
  reset.textContent = 'Reset layer order for this pose';
  reset.onclick = () => { delete state.order[state.pose]; buildPosRows(); };
  box.appendChild(reset);
}

// Plain text of every pose's part and gear positions, the layer order, and what is currently worn.
function exportPositions() {
  const out = { worn: { ...state.equip } };
  for (const key of Object.keys(POSES)) {
    out[key] = { order: orderFor(key), parts: {}, gear: {} };
    for (const p of POSES[key].parts) out[key].parts[p.id] = { x: p.x, y: p.y };
    for (const slot of Object.keys(GEAR_SLOTS)) {
      out[key].gear[slot] = {};
      for (const [opt, pl] of Object.entries(GEAR[key][slot] || {})) out[key].gear[slot][opt] = { x: pl.x, y: pl.y };
    }
  }
  return JSON.stringify(out, null, 2);
}

function selectPose(key) {
  state.pose = key;
  state.on = new Set(POSES[key].parts.map(p => p.id));
  t0 = performance.now();
  buildPosRows();
  sync();
}

function sync() {
  const pose = POSES[state.pose];
  document.querySelectorAll('[data-pose]').forEach(b => b.classList.toggle('on', b.dataset.pose === state.pose));
  document.querySelectorAll('[data-part]').forEach(b => b.classList.toggle('on', state.on.has(b.dataset.part)));
  document.querySelectorAll('[data-slot]').forEach(sel => {
    const slot = sel.dataset.slot;
    sel.value = state.equip[slot] || '';
    sel.disabled = !Object.keys(GEAR[state.pose]).includes(slot);
  });
  const missing = Object.keys(GEAR_SLOTS)
    .filter(slot => state.equip[slot] && !wornPlacement(state.pose, slot))
    .map(slot => `${GEAR_SLOTS[slot]} "${state.equip[slot]}" has no art for ${pose.label}`);
  noteEl.textContent = missing.join('. ');
}

buildControls();
requestAnimationFrame(loop);
</script>
</body>
</html>
