<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Part Animation Test</title>
<style>
  :root { --bg:#eef2f7; --panel:#ffffff; --ink:#1b2430; --line:#d5dde8; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f1622; --panel:#17212f; --ink:#e6edf6; --line:#2a3a50; --accent:#60a5fa; }
  }
  :root[data-theme="dark"] { --bg:#0f1622; --panel:#17212f; --ink:#e6edf6; --line:#2a3a50; --accent:#60a5fa; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; align-items:center; }
  h1 { font-size:18px; margin:4px 0; }
  canvas { width:500px; height:500px; max-width:100%; background:linear-gradient(#a9c9ea,#6f97c4); border:1px solid var(--line); border-radius:8px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; width:100%; box-sizing:border-box; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .panel .title { font-weight:700; width:100%; font-size:12px; opacity:.7; text-transform:uppercase; letter-spacing:.04em; }
  button { font:inherit; padding:6px 10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:6px; cursor:pointer; }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  label { display:flex; gap:6px; align-items:center; }
  .log { font:12px/1.5 ui-monospace, monospace; white-space:pre-wrap; opacity:.8; }
  .note { font-size:12px; opacity:.75; text-align:center; max-width:500px; min-height:1em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Body Part Animation Test</h1>
  <canvas id="c" width="500" height="500"></canvas>
  <div class="note" id="note"></div>

  <div class="panel" id="poses"><div class="title">Pose</div></div>
  <div class="panel" id="parts"><div class="title">Body parts</div></div>
  <div class="panel" id="gear"><div class="title">Equipment</div></div>
  <div class="panel">
    <div class="title">Playback</div>
    <label><input type="checkbox" id="bob" checked> Idle bob</label>
    <label>Speed <input type="range" id="speed" min="0.5" max="3" step="0.1" value="1"></label>
    <label>Scale <input type="range" id="scale" min="0.6" max="1.6" step="0.05" value="1"></label>
    <button id="restart">Restart</button>
  </div>
  <div class="log" id="log"></div>
</div>

<script>
// Placements are top-left corners in one shared frame. Every pose is centred on the same point (283.5, 239.4),
// so switching poses does not jump. Each part has an optional scale (sc) where the sample showed a smaller size.
// Positions come from matching each pose against the no-equipment reference renders (attack, critical, base, block).
// Gear (sword and shield, attack lv10 layers) is placed by the same hand offsets as the bare-body attack pose.
const CENTRE = { x: 283.5, y: 239.4 };

// Equipment per pose. Sword layers already contain the gripping hand, so the bare left hand is hidden while the sword is on.
// Shield layers have no hand: each shield's grip sits at the right hand's top-left corner (offset set from the attack pose).
const GEAR_NAMES = { shield: 'Shield', sword: 'Sword' };
const GEAR = {
  attack: {
    shield: { src: 'gear/attack/ssattackshield.png', x: 415, y: 154, sc: 1 },
    sword:  { src: 'gear/attack/ssattackswordlv10.png', x: 152, y: 175, sc: 1 }
  },
  base: {
    shield: { src: 'gear/shield/ssshield.png', x: 365, y: 139, sc: 1 },
    sword:  { src: 'gear/base/ssbasesword.png', x: 32, y: 239, sc: 1 }
  },
  block: {
    shield: { src: 'gear/shield/ssshield.png', x: 395, y: 138, sc: 1 },
    sword:  { src: 'gear/block/ssblocksword.png', x: 127, y: 224, sc: 1 }
  },
  critical: {
    shield: { src: 'gear/shield/ssshield.png', x: 429, y: 139, sc: 1 },
    sword:  { src: 'gear/critical/sscriticalsword.png', x: 60, y: 34, sc: 1 }
  }
};

const POSES = {
  base: {
    label: 'base',
    parts: [
      { id: 'leg',       name: 'Leg',        src: 'base/dbaseleg.png',       x: 208, y: 246, sc: 1 },
      { id: 'armor',     name: 'Armor',      src: 'base/dbasearmor.png',     x: 197, y: 133, sc: 0.8 },
      { id: 'head',      name: 'Head',       src: 'base/dbasehead.png',      x: 239, y: 37,  sc: 1 },
      { id: 'lefthand',  name: 'Left hand',  src: 'base/dbaselefthand.png',  x: 168, y: 241, sc: 0.95 },
      { id: 'righthand', name: 'Right hand', src: 'base/dbaserighthand.png', x: 355, y: 212, sc: 1.05 }
    ],
    gear: ['shield', 'sword']
  },
  attack: {
    label: 'attack',
    parts: [
      { id: 'leg',       name: 'Leg',        src: 'attack/dattackleg.png',       x: 112, y: 194, sc: 0.975 },
      { id: 'armor',     name: 'Armor',      src: 'attack/dattackarmor.png',     x: 193, y: 116, sc: 1 },
      { id: 'head',      name: 'Head',       src: 'attack/dattackhead.png',      x: 316, y: 43,  sc: 1 },
      { id: 'lefthand',  name: 'Left hand',  src: 'attack/dattacklefthand.png',  x: 165, y: 182, sc: 0.975 },
      { id: 'righthand', name: 'Right hand', src: 'attack/dattackrighthand.png', x: 406, y: 223, sc: 1 }
    ],
    gear: ['shield', 'sword']
  },
  block: {
    label: 'block',
    parts: [
      { id: 'leg',       name: 'Leg',        src: 'block/dblockleg.png',       x: 164, y: 263, sc: 1 },
      { id: 'armor',     name: 'Armor',      src: 'block/dblockarmor.png',     x: 164, y: 130, sc: 1 },
      { id: 'head',      name: 'Head',       src: 'block/dblockhead.png',      x: 258, y: 59,  sc: 1 },
      { id: 'lefthand',  name: 'Left hand',  src: 'block/dblocklefthand.png',  x: 146, y: 229, sc: 1 },
      { id: 'righthand', name: 'Right hand', src: 'block/dblockrighthand.png', x: 385, y: 211, sc: 1 }
    ],
    gear: ['shield', 'sword']
  },
  critical: {
    label: 'critical',
    parts: [
      { id: 'leg',       name: 'Leg',        src: 'critical/dcriticalleg.png',       x: 98,  y: 237, sc: 1 },
      { id: 'armor',     name: 'Armor',      src: 'critical/dcriticalarmor.png',     x: 131, y: 48,  sc: 1 },
      { id: 'head',      name: 'Head',       src: 'critical/dcriticalhead.png',      x: 287, y: 61,  sc: 1 },
      { id: 'lefthand',  name: 'Left hand',  src: 'critical/dcriticallefthand.png',  x: 244, y: 38,  sc: 0.8 },
      { id: 'righthand', name: 'Right hand', src: 'critical/dcriticalrighthand.png', x: 419, y: 212, sc: 1 }
    ],
    gear: ['shield', 'sword']
  }
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');
const noteEl = document.getElementById('note');
const state = {
  pose: 'attack',
  on: new Set(POSES.attack.parts.map(p => p.id)),
  gearOn: new Set(['shield', 'sword']),
  bob: true, speed: 1, scale: 1
};
const cache = {};
let t0 = performance.now();

function load(src) {
  if (!cache[src]) {
    cache[src] = new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('Failed to load ' + src));
      img.src = src;
    });
  }
  return cache[src];
}

// Build the draw list for the current pose. Gear is inserted at the position its draw order requires.
function drawList(poseKey) {
  const pose = POSES[poseKey];
  const g = GEAR[poseKey];
  const swordOn = state.gearOn.has('sword') && pose.gear.includes('sword');
  const shieldOn = state.gearOn.has('shield') && pose.gear.includes('shield');
  const list = [];
  // Attack: shield sits behind the armor. Base, block and critical: shield is drawn on top of the armor.
  const shieldBehindArmor = poseKey === 'attack';
  for (const part of pose.parts) {
    if (part.id === 'armor' && shieldOn && shieldBehindArmor) list.push({ id: 'shield', ...g.shield });
    if (part.id === 'armor') list.push(part);
    if (part.id === 'armor' && shieldOn && !shieldBehindArmor) list.push({ id: 'shield', ...g.shield });
    if (part.id === 'armor') continue;
    if (part.id === 'head' && swordOn) list.push({ id: 'sword', ...g.sword });
    if (part.id === 'lefthand' && swordOn) continue;   // the sword layer already shows the hand
    list.push(part);
  }
  return list;
}

let rendering = false;
async function draw(now) {
  const pose = POSES[state.pose];
  const s = state.scale;
  const bob = state.bob ? Math.sin((now - t0) * 0.0045 * state.speed) * 4 : 0;
  const ox = canvas.width / 2 - CENTRE.x * s;
  const oy = canvas.height / 2 - CENTRE.y * s + bob;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const notes = [];
  for (const item of drawList(state.pose)) {
    const isGear = item.src.startsWith('gear/');
    if (!isGear && !state.on.has(item.id)) continue;
    const img = await load(item.src);
    const k = s * (item.sc || 1);
    ctx.drawImage(img, ox + item.x * s, oy + item.y * s, img.naturalWidth * k, img.naturalHeight * k);
    notes.push(`${item.id}: ${img.naturalWidth}x${img.naturalHeight} at (${item.x}, ${item.y})`);
  }
  logEl.textContent = notes.join('\n');
}

function loop(now) {
  if (!rendering) {
    rendering = true;
    draw(now).catch(e => logEl.textContent = e.message).finally(() => rendering = false);
  }
  requestAnimationFrame(loop);
}

function buildControls() {
  const poseBox = document.getElementById('poses');
  for (const key of Object.keys(POSES)) {
    const b = document.createElement('button');
    b.textContent = POSES[key].label;
    b.dataset.pose = key;
    b.onclick = () => selectPose(key);
    poseBox.appendChild(b);
  }

  const partBox = document.getElementById('parts');
  for (const part of POSES.attack.parts) {
    const b = document.createElement('button');
    b.textContent = part.name;
    b.dataset.part = part.id;
    b.onclick = () => {
      if (state.on.has(part.id)) state.on.delete(part.id); else state.on.add(part.id);
      sync();
    };
    partBox.appendChild(b);
  }

  const gearBox = document.getElementById('gear');
  for (const key of Object.keys(GEAR_NAMES)) {
    const b = document.createElement('button');
    b.textContent = GEAR_NAMES[key] + ': on';
    b.dataset.gear = key;
    b.onclick = () => {
      if (state.gearOn.has(key)) state.gearOn.delete(key); else state.gearOn.add(key);
      sync();
    };
    gearBox.appendChild(b);
  }

  document.getElementById('bob').onchange = e => state.bob = e.target.checked;
  document.getElementById('speed').oninput = e => state.speed = +e.target.value;
  document.getElementById('scale').oninput = e => state.scale = +e.target.value;
  document.getElementById('restart').onclick = () => { t0 = performance.now(); };
  sync();
}

function selectPose(key) {
  state.pose = key;
  state.on = new Set(POSES[key].parts.map(p => p.id));
  t0 = performance.now();
  sync();
}

function sync() {
  const pose = POSES[state.pose];
  document.querySelectorAll('[data-pose]').forEach(b => b.classList.toggle('on', b.dataset.pose === state.pose));
  document.querySelectorAll('[data-part]').forEach(b => b.classList.toggle('on', state.on.has(b.dataset.part)));
  document.querySelectorAll('[data-gear]').forEach(b => {
    const key = b.dataset.gear;
    const has = pose.gear.includes(key);
    const on = has && state.gearOn.has(key);
    b.disabled = !has;
    b.classList.toggle('on', on);
    b.textContent = GEAR_NAMES[key] + ': ' + (on ? 'on' : 'off');
  });
  noteEl.textContent = '';
}

buildControls();
requestAnimationFrame(loop);
</script>
</body>
</html>
